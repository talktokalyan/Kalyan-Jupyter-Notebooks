
<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>
CPI Hierarchy Dashboard
</title>

<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

    background: #f5f7f8;
    color: #263238;
}

.header {
    height: 72px;
    background: white;
    border-bottom: 1px solid #dfe4e8;

    padding:
        12px 22px;

    display: flex;
    align-items: center;
    justify-content: space-between;
}

.title {
    font-size: 20px;
    font-weight: 700;
}

.subtitle {
    font-size: 11px;
    color: #68737a;
    margin-top: 3px;
}

.app {
    height: calc(100vh - 72px);

    display: grid;

    grid-template-columns:
        330px 1fr;

    gap: 12px;

    padding: 12px;
}

.sidebar {
    background: white;

    border:
        1px solid #dfe4e8;

    border-radius: 8px;

    display: flex;
    flex-direction: column;

    overflow: hidden;
}

.sidebar-header {
    padding: 12px;

    border-bottom:
        1px solid #e6eaed;

    font-size: 12px;
    font-weight: 700;
}

.tree {
    overflow-y: auto;
    padding: 7px;
}

.tree-row {
    display: flex;
    align-items: center;

    min-height: 25px;

    border-radius: 4px;

    cursor: pointer;

    padding:
        2px 5px;
}

.tree-row:hover {
    background: #f1f4f6;
}

.tree-row.selected {
    background: #e8eef1;
}

.toggle {
    width: 20px;
    border: 0;
    background: transparent;
    cursor: pointer;
    color: #52636b;
}

.tree-label {
    flex: 1;
    font-size: 11px;
    line-height: 1.2;
}

.tree-type {
    font-size: 7px;
    font-weight: 700;
    opacity: .75;
}

.tree-weight {
    font-size: 9px;
    color: #64748b;
}

.dashboard {
    display: grid;

    grid-template-rows:
        auto minmax(400px, 1fr);

    gap: 12px;

    min-width: 0;
}

.info {
    background: white;

    border:
        1px solid #dfe4e8;

    border-radius: 8px;

    padding: 12px;

    display: flex;
    gap: 25px;
}

.info-title {
    font-weight: 700;
    font-size: 15px;
}

.info-small {
    font-size: 10px;
    color: #64748b;
}

.chart-panel {
    background: white;

    border:
        1px solid #dfe4e8;

    border-radius: 8px;

    overflow: hidden;

    display: flex;
    flex-direction: column;
}

.chart-header {
    padding:
        10px 14px;

    border-bottom:
        1px solid #e6eaed;
}

.chart-title {
    font-size: 13px;
    font-weight: 700;
}

.chart-subtitle {
    font-size: 10px;
    color: #64748b;
}

#treemap {
    flex: 1;
    min-height: 0;
}

.legend {
    font-size: 9px;
    color: #64748b;
    padding: 6px 10px;
    border-top: 1px solid #eef1f3;
}

</style>

</head>

        <div id="treemap">

        <div class="legend">
            Hover over a rectangle for details.
            Click a rectangle to drill down.
        </div>

    </div>

</div>

    1: "Divisions",
    2: "Groups",
    3: "Classes",
    4: "Sub-classes",
    5: "Items"
};

let selectedId = 0;


// ============================================================
// BASIC FUNCTIONS
// ============================================================

function children(id) {

    return DATA.filter(
        d => d.parent === id
    );

}


function getNode(id) {

    return DATA.find(
        d => d.id === id
    );

}


// ============================================================
// COLOUR FUNCTIONS
// ============================================================

function divisionNode(node) {

    if(node.level === 1)
        return node;

    let current = node;

    while(current.parent !== null) {

        const parent =
            getNode(current.parent);

        if(!parent)
            break;

        if(parent.level === 1)
            return parent;

        current = parent;

    }

    return null;

}


function hexToRgb(hex) {

    hex = hex.replace("#","");

    return {
        r: parseInt(hex.substring(0,2),16),
        g: parseInt(hex.substring(2,4),16),
        b: parseInt(hex.substring(4,6),16)
    };

}


function lighten(hex, amount) {

    const c = hexToRgb(hex);

    return "rgb(" +

        Math.round(
            c.r + (255-c.r)*amount
        ) + "," +

        Math.round(
            c.g + (255-c.g)*amount
        ) + "," +

        Math.round(
            c.b + (255-c.b)*amount
        ) +

        ")";

}


function nodeColor(node) {

    if(node.level === 0)
        return "#2F5D62";

    const div =
        divisionNode(node);

    if(!div)
        return "#65727A";

    const divisions =
        children(0);

    const idx =
        divisions.findIndex(
            d => d.id === div.id
        );

    const base =
        DIVISION_COLORS[
            idx % DIVISION_COLORS.length
        ];

    if(node.level === 1)
        return base;

    const amount = {

        2: .16,
        3: .28,
        4: .40,
        5: .52

    }[node.level] || .52;

    return lighten(
        base,
        amount
    );

}


// ============================================================
// SIDEBAR TREE
// ============================================================

function renderTree() {

    const container =
        document.getElementById("tree");

    container.innerHTML = "";

    const root =
        getNode(0);

    drawNode(
        root,
        container,
        0
    );

}


function drawNode(
    node,
    container,
    depth
) {

    const kids =
        children(node.id);

    const row =
        document.createElement("div");

    row.className =
        "tree-row" +
        (
            selectedId === node.id
            ? " selected"
            : ""
        );

    row.style.paddingLeft =
        (depth * 13) + "px";


    const toggle =
        document.createElement("button");

    toggle.className =
        "toggle";

    toggle.textContent =
        kids.length
        ? "+"
        : "•";


    const label =
        document.createElement("span");

    label.className =
        "tree-label";


    const type =
        document.createElement("span");

    type.className =
        "tree-type";

    type.textContent =
        "(" +
        node.nature.toLowerCase() +
        ") ";


    const name =
        document.createElement("span");

    name.textContent =
        node.name;


    const weight =
        document.createElement("span");

    weight.className =
        "tree-weight";

    weight.textContent =
        node.weight.toFixed(2) +
        "%";


    label.appendChild(type);
    label.appendChild(name);

    row.appendChild(toggle);
    row.appendChild(label);
    row.appendChild(weight);

    container.appendChild(row);


    let open = false;


    toggle.onclick = function(event) {

        event.stopPropagation();

        if(!kids.length)
            return;

        open = !open;

        toggle.textContent =
            open ? "−" : "+";

        if(open) {

            const childContainer =
                document.createElement("div");

            childContainer.className =
                "children";

            kids.forEach(
                child =>
                    drawNode(
                        child,
                        childContainer,
                        depth + 1
                    )
            );

            row.after(
                childContainer
            );

        } else {

            const next =
                row.nextElementSibling;

            if(next &&
               next.classList.contains(
                   "children"
               )) {

                next.remove();

            }

        }

    };


    row.onclick =
        function() {

            selectNode(
                node.id
            );

        };

}


// ============================================================
// SELECT NODE
// ============================================================

function selectNode(id) {

    selectedId = id;

    const node =
        getNode(id);

    document.getElementById(
        "selectedName"
    ).textContent =
        node.name;

    document.getElementById(
        "selectedCode"
    ).textContent =
        node.code;

    document.getElementById(
        "selectedNature"
    ).textContent =
        node.nature;

    document.getElementById(
        "selectedLevel"
    ).textContent =
        node.level;

    document.getElementById(
        "selectedWeight"
    ).textContent =
        node.weight.toFixed(2) +
        "%";

    renderTree();

    renderTreemap(
        node
    );

}


// ============================================================
// TREEMAP
// ============================================================

function renderTreemap(parent) {

    const kids =
        children(parent.id);

    const div =
        document.getElementById(
            "treemap"
        );

    if(!kids.length) {

        Plotly.react(
            div,
            [],
            {
                margin: {
                    l:0,r:0,t:0,b:0
                }
            }
        );

        return;

    }


    const labels =
        kids.map(
            d => d.name
        );

    const ids =
        kids.map(
            d => String(d.id)
        );

    const values =
        kids.map(
            d => d.weight
        );

    const colors =
        kids.map(
            d => nodeColor(d)
        );

    const shares =
        kids.map(
            d => parent.weight
            ? d.weight /
              parent.weight *
              100
            : 0
        );


    const customdata =
        kids.map(
            (d,i) => [

                d.code,

                d.nature,

                d.weight,

                shares[i],

                d.indent

            ]
        );


    const trace = {

        type: "treemap",

        labels: labels,

        ids: ids,

        parents:
            kids.map(
                () => ""
            ),

        values: values,

        branchvalues:
            "total",

        customdata:
            customdata,

        marker: {

            colors: colors,

            line: {

                color: "white",

                width: 2

            }

        },

        texttemplate:
            "<b>%{label}</b>" +
            "<br>%{customdata[3]:.1f}%" +
            "<br>%{customdata[2]:.2f}%",

        hovertemplate:

            "<b>%{label}</b>" +

            "<br>Code: %{customdata[0]}" +

            "<br>Nature: %{customdata[1]}" +

            "<br>Weight: %{customdata[2]:.2f}%" +

            "<br>Share of parent: %{customdata[3]:.2f}%" +

            "<br>Indentation: %{customdata[4]} spaces" +

            "<extra></extra>"

    };


    const layout = {

        margin: {
            l: 4,
            r: 4,
            t: 4,
            b: 4
        },

        paper_bgcolor:
            "white",

        plot_bgcolor:
            "white",

        font: {
            family:
                "Arial, sans-serif"
        },

        uniformtext: {
            minsize: 9,
            mode: "hide"
        }

    };


    Plotly.react(
        div,
        [trace],
        layout,
        {
            responsive: true,
            displaylogo: false
        }
    );

}


// ============================================================
// INITIALISE
// ============================================================

renderTree();

renderTreemap(
    getNode(0)
);

</script>

</body>
